    RfidSessionData:
      title: RfidSessionData
      required:
        - AccessControls
        - Applications
        - CardProperties
        - ExtLeSupport
        - ProcessTime
        - RootFiles
        - SecurityObjects
        - Session_procedure
        - Session_terminal
        - TotalBytesReceived
        - TotalBytesSent
      type: object
      properties:
        VirtualMode:
          type: boolean
          description: >-
            Sign of virtual session when working with loaded data from a
            previous communication session with the electronic document
        SDKVersion:
          type: string
          description: Text SDKVersion value in format A.B (e.g. 3.1)
        DriverVersion:
          type: string
          description: Text DriverVersion value in format A.B.C.D (e.g. 6.2.5.4)
        FirmwareVersion:
          type: string
          description: Text FirmwareVersion value in format A.B (e.g. 5.19)
        Applications:
          type: array
          description: >-
            List of containers to store information about the involved
            applications of electronic document
          items:
            $ref: '#/components/schemas/RfidApplication'
        AccessControls:
          type: array
          description: >-
            List of containers to store information about the supported
            procedures of authentication and secure data access within the
            context of the session
          items:
            $ref: '#/components/schemas/RfidAccessControlInfo'
        CardProperties:
          $ref: '#/components/schemas/RfidCardPropertiesExt'
        ExtLeSupport:
          $ref: '#/components/schemas/RFIDErrorCodes'
        ProcessTime:
          type: number
          description: Time of processing, milliseconds
        RootFiles:
          type: array
          description: >-
            List of containers to store information about the read files of the
            root Master File
          items: {}
        TotalBytesSent:
          type: number
          description: >-
            Total number of bytes transmitted to the RFID-chip during the whole
            session
        TotalBytesReceived:
          type: number
          description: >-
            Total number of bytes received from the RFID-chip during the whole
            session
        Session_key:
          $ref: '#/components/schemas/RfidAccessKey'
        Session_terminal:
          $ref: '#/components/schemas/RfidTerminal'
        Session_procedure:
          $ref: '#/components/schemas/RfidAuthenticationProcedureType'
        SecurityObjects:
          type: array
          description: >-
            List of containers to store information about the detected document
            security objects
          items:
            $ref: '#/components/schemas/RfidSecurityObject'
        Status:
          $ref: '#/components/schemas/CheckResult'
      description: >-
        Structure is used to describe the results of work with the SDK within
        the context of the current communication session with electronic
        document
    RfidApplication:
      title: RfidApplication
      required:
        - ApplicationID
        - DataHashAlgorithm
        - Files
        - Status
        - Type
        - UnicodeVersion
        - Version
      type: object
      properties:
        Type:
          $ref: '#/components/schemas/RfidApplicationType'
        Status:
          $ref: '#/components/schemas/RFIDErrorCodes'
        ApplicationID:
          type: string
          description: Application identifier
        Version:
          type: string
          description: Version of the application
        UnicodeVersion:
          type: string
          description: Unicode version for application
        DataHashAlgorithm:
          type: string
          description: >-
            Algorithm for calculating hash values for files for the procedure of
            PA
        Files:
          type: array
          description: >-
            List of containers to store information about the read files of the
            application
          items:
            $ref: '#/components/schemas/RfidDataFile'
      description: >-
        Structure is used to describe the contents of a single LDS application
        and their analysis within the context of the communication session with
        electronic document
    RfidApplicationType:
      title: RfidApplicationType
      type: integer
      description: >-
        Enumeration contains a set of constants that define the type of
