        - Type
      type: object
      properties:
        Type:
          type: integer
          description: Logical type of the field
        Status:
          type: number
          description: >-
            Result of logical analysis of compliance of the contents of the
            field with the requirements of the specification
        Length:
          type: number
          description: Length of Data array
        Data:
          type: string
