    ComparisonMatrix:
      title: ComparisonMatrix
      maxItems: 10
      minItems: 10
      type: array
      description: >-
        results comparison matrix. Elements of the matrix with indices 0, 1, 2,
        3 take one of the values Disabled(0), Verified(1) or Not_Verified(2),
        elements with indices 4, 5, 6, 7, 8 are one of the values Disabled(0),
        Compare_Match(3) or Compare_Not_Match(4). Elements of the Matrix matrix
        have the following semantic meaning:

        - element with index 0 –– the result of verification of data from the
        MRZ; - 1 –– the result of verification of data from the RFID
        microcircuit; - 2 –– the result of verification of data from text areas
        of the document; - 3 –– the result of verification data from barcodes; -
        4 - the result of comparing MRZ data and RFID microcircuits; - 5 - the
        result of comparing MRZ data and text areas of document filling; - 6 -
        the result of comparing MRZ data and bar codes; - 7 - the result of
        comparing the data of text areas of the document and the RFID chip; - 8
        - the result of comparing the data of the text areas of the document and
        barcodes; - 9 - the result of comparing the data of the RFID chip and
        barcodes.
      example:
        - 1
        - 0
        - 0
        - 0
        - 0
        - 3
        - 0
        - 0
        - 0
        - 0
      items:
        $ref: '#/components/schemas/VerificationResult'
