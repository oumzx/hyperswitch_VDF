    MDLDeviceEngagement:
      title: MDLDeviceEngagement
      type: integer
      enum:
        - 0
        - 1
      x-enum-varnames:
        - QR
        - NFC
    MDLDeviceRetrieval:
      title: MDLDeviceRetrieval
      type: integer
      enum:
        - 1
        - 2
        - 3
      x-enum-varnames:
        - NFC
        - BLE
        - WIFI_AWARE
    MDLServerRetrieval:
      title: MDLServerRetrieval
      type: integer
      enum:
        - 0
        - 1
      x-enum-varnames:
        - WEB_API
        - OIDC
    ProcessResponse:
      title: ProcessResponse
      required:
        - ChipPage
        - ContainerList
        - ProcessingFinished
        - TransactionInfo
        - elapsedTime
        - morePagesAvailable
      type: object
      properties:
        ChipPage:
          $ref: '#/components/schemas/RfidLocation'
        CoreLibResultCode:
          type: integer
        ProcessingFinished:
          $ref: '#/components/schemas/ProcessingStatus'
        ContainerList:
          $ref: '#/components/schemas/ContainerList'
        TransactionInfo:
          $ref: '#/components/schemas/TransactionInfo'
        log:
          type: string
          description: Base64 encoded transaction processing log
        passBackObject:
          type: object
          additionalProperties: true
          description: >-
            Free-form object provided in request. See passBackObject property of
            ProcessRequest.
        morePagesAvailable:
          type: integer
        elapsedTime:
          type: integer
          description: Time the document processing has taken, ms.
        metadata:
          type: object
          additionalProperties: true
    ProcessingStatus:
      title: ProcessingStatus
      type: integer
      enum:
        - 0
        - 1
        - 2
      x-enum-descriptions:
        - Processing was not finished
        - Processing finished
        - Processing finished by timeout
      x-enum-varnames:
        - NOT_FINISHED
        - FINISHED
        - TIMEOUT
    TransactionInfo:
      title: TransactionInfo
      type: object
      properties:
        ComputerName:
          type: string
          description: Computer name
        DateTime:
          type: string
          description: Date and time
        DocumentsDatabase:
          $ref: '#/components/schemas/DocumentsDatabase'
        SystemInfo:
          type: string
          description: System information
        Tag:
          type: string
          description: Transaction tag
        TransactionID:
          type: string
          description: Transaction identifier
        UserName:
          type: string
          description: User name
        Version:
          type: string
          description: SDK version
      example:
        ComputerName: 7cded6852d20
        DateTime: '2020-05-27T08:17:03.247Z'
        TransactionID: dc5eb444-ad6e-4ebc-8102-d62d5bb56a4e
        UserName: user
    DocumentsDatabase:
      title: DocumentsDatabase
      type: object
      properties:
        Description:
          type: string
          description: Document database description
        ExportDate:
          type: string
          description: Date the document database was created
        ID:
          type: string
          description: Document database identifier
        Version:
          type: string
          description: Document database version
      description: Document database information
    ProcessRequest:
      title: ProcessRequest
      required:
        - processParam
      type: object
      properties:
        processParam:
          $ref: '#/components/schemas/ProcessParams'
        List:
          type: array
          items:
            $ref: '#/components/schemas/ProcessRequestImage'
        tag:
          type: string
          description: Session ID
        tenant:
          type: string
          description: Customer name
        env:
          type: string
          description: Environment type
        livePortrait:
          type: string
          description: Live portrait photo
          format: base64
          example: Base64 encoded data
        extPortrait:
          type: string
          description: Portrait photo from an external source
          format: base64
          example: Base64 encoded data
        ContainerList:
          $ref: '#/components/schemas/ContainerList'
        systemInfo:
          $ref: '#/components/schemas/ProcessSystemInfo'
        passBackObject:
          type: object
          additionalProperties: true
          description: >-
            Free-form object to be included in response. Must be object, not
            list or simple value. Do not affect document processing. Use it
            freely to pass your app params. Stored in process logs.
        dtc:
          type: string
          description: >-
            Digital Travel Credential (DTC-VC) data in base64 format for
            processing
        ImageUrls:
          type: array
          description: URLs to the document images for processing.
          items:
            type: string
    ProcessParams:
      title: ProcessParams
      required:
        - scenario
      type: object
      properties:
        generateDTCVC:
          type: boolean
          description: >-
            This parameter is used to generate separate DTC-VC data container
            from RFID session data.
        lcidFilter:
          type: array
          description: >-
            The list of LCID types to recognize. If empty, values with all LCID
            types will be extracted. Empty by default.
          items:
            $ref: '#/components/schemas/LCID'
        checkLiveness:
          type: boolean
          description: This parameter is used to enable document liveness check.
        lcidIgnoreFilter:
          type: array
          description: >-
            The list of LCID types to ignore during the recognition. If empty,
            values with all LCID types will be extracted. Narrowing down the
            list can reduce processing time. Empty by default.
          items:
            $ref: '#/components/schemas/LCID'
        oneShotIdentification:
          type: boolean
          description: >-
            This parameter allows processing an image that contains a person and
            a document and compare the portrait photo from the document with the
            person's face
        useFaceApi:
          type: boolean
          description: This parameter allows comparing faces on Regula Face Web Service
        faceApi:
          $ref: '#/components/schemas/FaceApi'
        doDetectCan:
          type: boolean
          description: >-
            This parameter allows enabling the CAN (Card Access Number)
            detection and recognition when using scenarios with document
            location and MRZ reading, such as the MrzAndLocate scenario.
        imageOutputMaxHeight:
          type: integer
          description: >-
            This parameter allows setting maximum height in pixels of output
            images and thus reducing image size to desired. Does not change the
            aspect ratio. Changes disabled if equals to 0. Default 0.
        imageOutputMaxWidth:
          type: integer
          description: >-
            This parameter allows setting maximum width in pixels of output
            images and thus reducing image size to desired. Does not change the
            aspect ratio. Changes disabled if equals to 0. Default 0.
        scenario:
          $ref: '#/components/schemas/Scenario'
        resultTypeOutput:
          type: array
          description: >-
            Types of results to return in response. See 'Result' enum for
            available options
          items:
            $ref: '#/components/schemas/Result'
        doublePageSpread:
          type: boolean
          description: >-
            Enable this option if the image you provide contains double page
            spread of the passport and you want to process both pages in one go.
            It makes sense to use it for documents that have meaningful
            information on both pages, like Russian domestic passport, or some
            others. Disabled by default.
          deprecated: true
        generateDoublePageSpreadImage:
          type: boolean
          description: >-
            When enabled together with "doublePageSpread" and there is a
            passport with two pages spread in the image, pages will be cropped,
            straightened and aligned together, as if the document was captured
            on a flatbed scanner. Disabled by default.
        fieldTypesFilter:
          type: array
          description: >-
            If a document contains Visual zone, you can set the list of field
            types to extract. In this case, other fields are skipped during the
            processing, i.e. document recognition becomes faster. This filter is
            not applicable to the MRZ, barcode or RFID. If the fieldTypesFilter
            is empty, all fields are extracted. Empty by default. If
            fieldTypesFilter and fieldTypesIgnoreFilter are used simultaneously,
            fieldTypesFilter takes priority.
          items:
            $ref: '#/components/schemas/TextFieldType'
        fieldTypesIgnoreFilter:
          type: array
          description: >-
            If a document contains a Visual zone, you can specify a list of
            field types that should be excluded from extraction. All field types
            listed in this array are skipped during processing, while the
            remaining fields are recognized. This filter is not applicable to
            the MRZ, barcode or RFID. If the fieldTypesIgnoreFilter is empty,
            all fields are extracted. Empty by default. If fieldTypesFilter and
            fieldTypesIgnoreFilter are used simultaneously, fieldTypesFilter
            takes priority.
          items:
            $ref: '#/components/schemas/TextFieldType'
        dateFormat:
          type: string
          description: >-
            This option allows you to set dates format so that solution will
            return dates in this format. For example, if you supply
            'MM/dd/yyyy', and document have printed date '09 JUL 2020' for the
            date os issue, you will get '07/09/2020' as a result. By default it
            is set to system locale default (where the service is running).
          example: MM/dd/yyyy
        measureSystem:
          $ref: '#/components/schemas/MeasureSystem'
        imageDpiOutMax:
          type: integer
          description: >-
            This parameter controls maximum resolution in dpi of output images.
            Resolution will remain original in case 0 is supplied. By default is
            set to return images in response with resolution not greater than
            300 dpi for all scenarios except FullAuth. In FullAuth scenario this
            limit is 1000 dpi by default.
        alreadyCropped:
          type: boolean
          description: >-
            This option can be enabled if you know for sure that the image you
            provide contains already cropped document by its edges. This was
            designed to process on the server side images captured and cropped
            on mobile. Disabled by default.
        customParams:
          type: object
          additionalProperties: true
          description: >-
            This option allows passing custom processing parameters that can be
            implemented in future without changing API.
        config:
          type: array
          description: >-
            This option allows setting additional custom configuration per
            document type. If recognized document has ID specified in config,
            processing adjusts according to designated configuration.
          items:
            $ref: '#/components/schemas/PerDocumentConfig'
        log:
          type: boolean
          description: >-
            When enabled, results will contain transaction processing log.
            Disabled by default
        logLevel:
          $ref: '#/components/schemas/LogLevel'
        forceDocID:
          type: integer
          description: >-
            Force use of specific template ID and skip document type
            identification step.
        matchTextFieldMask:
          type: boolean
          description: >-
            When disabled, text field OCR will be done as is and then the
            recognized value will be matched to the field mask for validity. If
            enabled, we are trying to read a field value with maximum efforts to
            match the mask and provide a correctly formatted value, making
            assumptions based on the provided field mask in the template.
            Enabled by default.
        fastDocDetect:
          type: boolean
          description: >-
            When enabled, shorten the list of candidates to process during
            document detection in a single image process mode. Reduces
            processing time for specific backgrounds. Enabled by default.
          deprecated: true
        updateOCRValidityByGlare:
          type: boolean
          description: >-
            When enabled, fail OCR field validity, if there is a glare over the
            text field on the image. Disabled by default.
        checkRequiredTextFields:
          type: boolean
          description: >-
            When enabled, each field in template will be checked for value
            presence and if the field is marked as required, but has no value,
            it will have 'error' in validity status. Disabled by default.
        returnCroppedBarcode:
          type: boolean
          description: >-
            When enabled, returns cropped barcode images for unknown documents.
            Disabled by default.
        imageQa:
          $ref: '#/components/schemas/ImageQA'
        strictImageQuality:
          type: boolean
          description: >-
            When enabled, the image quality check status affects the document
            optical and overall status. Disabled by default.
        respectImageQuality:
          type: boolean
          description: >-
            Deprecated. Please use strictImageQuality instead. When enabled,
            image quality checks status affects document optical and overall
            status. Disabled by default.
          deprecated: true
        forceDocFormat:
          $ref: '#/components/schemas/DocumentFormat'
        noGraphics:
          type: boolean
          description: >-
            When enabled, no graphic fields will be cropped from document image.
            Disabled by default.
        depersonalizeLog:
          type: boolean
          description: >-
            When enabled, all personal data will be forcibly removed from the
            logs. Disabled by default.
        multiDocOnImage:
          type: boolean
          description: >-
            This option allows locating and cropping multiple documents from one
            image if enabled. Disabled by default.
        shiftExpiryDate:
          type: integer
          description: >-
            This option allows shifting the date of expiry into the future or
            past for number of months specified. This is useful, for example, in
            some cases when document might be still valid for some period after
            original expiration date to prevent negative validity status for
            such documents. Or by shifting the date to the past will set
            negative validity for the documents that is about to expire in a
            specified number of months. 0 by default
        minimalHolderAge:
          type: integer
          description: >-
            This options allows specifying the minimal age in years of the
            document holder for the document to be considered valid.
        returnUncroppedImage:
          type: boolean
          description: When enabled, returns input images in output. Disabled by default.
        mrzFormatsFilter:
          type: array
          description: >-
            This option allows limiting MRZ formats to be recognized by
            specifying them in array.
          items:
            $ref: '#/components/schemas/MRZFormat'
        forceReadMrzBeforeLocate:
          type: boolean
          description: >-
            When enabled, make sure that in series processing MRZ is located
            fully inside the result document image, if present on the document.
            Enabling this option may add extra processing time, by disabling
            optimizations, but allows more stability in output image quality.
            Disabled by default.
        parseBarcodes:
          type: boolean
          description: >-
            This option can be disabled to stop parsing after barcode is read.
            Enabled by default.
        convertCase:
          $ref: '#/components/schemas/TextPostProcessing'
        splitNames:
          type: boolean
          description: >-
            When enabled, the Surname and GivenNames fields from MRZ will be
            divided into ft_First_Name, ft_Second_Name, ft_Third_Name,
            ft_Fourth_Name, ft_Last_Name fields. Disabled by default.
        disablePerforationOCR:
          type: boolean
          description: >-
            When enabled, OCR of perforated fields in the document template will
            not be performed. Disabled by default.
        documentGroupFilter:
          type: array
          description: >-
            List of specific eligible document types from DocumentType enum to
            recognize from. You may, for example, specify only passports to be
            recognized by setting this property. Empty by default.
          items:
            $ref: '#/components/schemas/DocumentType'
        processAuth:
          type: integer
          description: >-
            Authenticity checks that should be performed regardless of the
            document type. The available checks are listed in the
            eRPRM_Authenticity enum. Note that only supported by your license
            checks can be added.
          format: int64
        deviceId:
          type: integer
          description: >-
            This parameter is used to specify the document reader device type
            from which input images were captured. Default 0.
        deviceType:
          type: integer
          description: >-
            This parameter is used to specify the document reader device type
            from which input images were captured. Default 0.
        deviceTypeHex:
          type: string
          description: >-
            This parameter is used to specify the document reader device type
            from which input images were captured
        ignoreDeviceIdFromImage:
          type: boolean
          description: >-
            This parameter is used to tell the processing engine to ignore any
            parameters saved in the image when scanned from the document reader
            device. Default false
        documentIdList:
          type: array
          description: >-
            List of the document ID's to process. All documents will be
            processed, if empty.
          items:
            type: integer
        rfid:
          $ref: '#/components/schemas/ProcessParams_rfid'
        checkAuth:
          type: boolean
          description: This parameter is used to enable authenticity checks
        authParams:
          $ref: '#/components/schemas/AuthParams'
        mrzDetectMode:
          $ref: '#/components/schemas/mrzDetectModeEnum'
        generateNumericCodes:
          type: boolean
          description: >-
            This parameter is used to generate numeric representation for
            issuing state and nationality codes
        strictBarcodeDigitalSignatureCheck:
          type: boolean
          description: >-
            This parameter if enabled will require all necessary certificates to
            verify digital signature in barcode data to be present in order for
            the Barcode format check to succeed.
        selectLongestNames:
          type: boolean
          description: >-
            Select the longest value from the different value sources and write
            it to the value field if comparison is done successfully. The
            parameter applies this logic to the personal names, such as given
            name, surname, surname and given name, middle name and etc.
        doBarcodes:
          type: array
          description: Set the types of barcodes to process.
          items:
            $ref: '#/components/schemas/InputBarcodeType'
        strictDLCategoryExpiry:
          type: boolean
          description: >-
            Set to force DL categories expiry date to affect the overall status
            or not. As documents usually have their own date of expiry, which
            might be less or greater than category expiry date, this might be
            handy for specific cases.
        generateAlpha2Codes:
          type: boolean
          description: >-
            Set to generate Alpha-2 codes for nationality and issuing state
            fields.
        pdfPagesLimit:
          type: integer
          description: Limits the number of pages to be processed from a PDF file.
        disableAuthResolutionFilter:
          type: boolean
          description: >-
            This parameter if enabled will ignore the minimum barcode resolution
            needed to start processing.
        strictSecurityChecks:
          type: boolean
          description: >-
            When enabled, this parameter marks security checks that don’t meet
            minimum requirements as 'Failed' (instead of 'WasNotDone'), which
            causes the overall security status to be 'Failed'.
        returnTransliteratedFields:
          type: boolean
          description: >-
            Allows transliteration to be turned on or off; by default, it is
            enabled.
