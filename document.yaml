          $ref: '#/components/schemas/RfidDataFileType'
        FileData:
          $ref: '#/components/schemas/TrfFtBytes'
        ReadingStatus:
          $ref: '#/components/schemas/RFIDErrorCodes'
        ReadingTime:
          type: number
          description: Time of reading, milliseconds
        PA_Status:
          $ref: '#/components/schemas/RFIDErrorCodes'
        Notifications:
          type: array
          description: >-
            List of remarks arisen when reading data from the memory of the chip
