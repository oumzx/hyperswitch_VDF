        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
      x-enum-descriptions:
        - Root files
        - ePassport application
        - eID application
        - eSign application
        - eDL application
        - TravelRecords application
        - VisaRecords application
        - AddBiometrics application
        - Digital Travel Credentials
        - Master File
      x-enum-varnames:
        - ROOT_FILES
        - E_PASSPORT
        - E_ID
        - E_SIGN
        - E_DL
        - LDS2_TravelRecords
        - LDS2_VisaRecords
        - LDS2_AddBiometrics
        - eDTC_PC
    RfidDataFile:
      title: RfidDataFile
      required:
        - ReadingStatus
        - Type
      type: object
      properties:
        FileID:
          type: string
          description: >-
            File identifier. Each byte of FileID represented by its hexadecimal
            value. The individual bytes are separated by spaces (e.g. 01 1E)
