        UID:
          type: string
          description: >-
            UID contents in text format. Each byte is represented by its
            hexadecimal value. The individual bytes are separated by spaces
            (e.g. F9 4F 41 60)
        ATQ_A:
          description: >-
            Reply of the «A» type chip to «REQA» command of ISO/IEC 14443-3
            protocol (Answer To Request, Type A – ATQA) – for the internal use
            by the main control library
        SAK:
          description: >-
            Response of type-A RFID-chip to SELECT command of ISO/IEC 14443-3
            protocol (Select Acknowledge, SAK).
        ATQ_B:
          description: >-
            ATQ_B contents in text format. Each byte is represented by its
            hexadecimal value. The individual bytes are separated by spaces
            (e.g. 50 F9 4F 41 60 00 00 00 00 77 81 81)
        BitRateS:
          $ref: '#/components/schemas/RfidBaudRate'
        BitRateR:
          $ref: '#/components/schemas/RfidBaudRate'
        ATR:
          type: string
          description: ATR-string of RFID-chip
