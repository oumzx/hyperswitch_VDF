        - Verification passed
        - Verification failed
        - Positive comparison result
        - Negative comparison result
      x-enum-varnames:
        - DISABLED
        - VERIFIED
        - NOT_VERIFIED
        - COMPARE_MATCH
        - COMPARE_NOT_MATCH
