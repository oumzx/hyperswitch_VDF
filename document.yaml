    FaceApi:
      title: FaceApi
      type: object
      properties:
        url:
          type: string
          description: The URL of the Regula Face Web service to be used.
          example: https://faceapi.regulaforensics.com
        mode:
          type: string
          description: 'The processing mode: "match" or "match+search".'
          example: match
        search:
          $ref: '#/components/schemas/FaceApi_search'
        threshold:
          type: integer
          description: >-
            The similarity threshold, 0-100. Above 75 means that the faces'
            similarity is verified, below 75 is not.
          example: 75
        serviceTimeout:
          type: integer
          description: The Regula Face Web service requests timeout, ms.
          example: 3000
        proxy:
          type: string
          description: >-
            Proxy to use, should be set according to the <a
            href="https://curl.se/libcurl/c/CURLOPT_PROXY.html"
            target="_blank">cURL standard</a>.
          example: http://localhost:8080
        proxy_userpwd:
          type: string
          description: >-
            Username and password to use for proxy authentication, should be set
            according to the <a
            href="https://curl.se/libcurl/c/CURLOPT_PROXYUSERPWD.html"
            target="_blank">cURL standard</a>.
          example: user:pass
        proxy_type:
          type: integer
          description: >-
            Proxy protocol type, should be set according to the <a
            href="https://curl.se/libcurl/c/CURLOPT_PROXYTYPE.html"
            target="_blank">cURL standard</a>.
          example: 0
        childAgeThreshold:
          type: integer
          description: 'The age threshold for the portrait comparison. Default: 13.'
          example: 13
        childDocValidityYears:
          type: integer
          description: >-
            Estimated duration of validity for a child's passport, years.
            Default: 5.
          example: 5
    Scenario:
      title: Scenario
      type: string
      description: Document processing scenario
      enum:
        - Mrz
        - Barcode
        - Locate
        - Ocr
        - DocType
        - MrzOrBarcode
        - MrzOrLocate
        - MrzAndLocate
        - BarcodeAndLocate
        - MrzOrOcr
        - MrzOrBarcodeOrOcr
        - LocateVisual_And_MrzOrOcr
        - FullProcess
        - FullAuth
        - RusStamp
        - OcrFree
        - CreditCard
        - Capture
        - DTC
        - RFID
      x-enum-varnames:
        - MRZ
