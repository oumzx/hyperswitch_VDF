    InputImageQualityChecks:
      title: InputImageQualityChecks
      type: string
      description: Input image quality checks for the document processing
      enum:
        - glaresCheck
        - focusCheck
        - dpiThreshold
        - colornessCheck
        - perspectiveCheck
        - documentPosition
        - portraitCheck
        - brightnessCheck
        - occlusionCheck
      x-enum-varnames:
        - Glares
        - Focus
        - Resolution
        - Colorness
        - Perspective
        - Bounds
        - Portrait
        - Brightness
        - Occlusion
      x-enum-descriptions:
        - Signals glare presence on the image
        - Signals whether image is in focus
        - Signals if image resolution is below threshold
        - Signals if image is colorless
        - >-
          Signals if document in the image has prespective distortion above
          threshold
        - Signals if document is not fully present in the image
        - Signals if the portrait is present
        - Signals if the document image is bright enough
        - Signals if the document image has occlusion
    GlaresCheckParams:
      title: GlaresCheckParams
      type: object
      properties:
        imgMarginPart:
          type: number
          description: Margin from the edges of the image. 0.35 = 35%
          format: float
          example: 0.35
        maxGlaringPart:
          type: number
          description: >-
            The maximum allowable part of the area occupied by the glare. The
            same: 0.06 = 6%
          format: float
          example: 0
